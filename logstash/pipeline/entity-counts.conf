input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["topic2"]
    group_id => "gp1-logstash-entity-counts"
    consumer_threads => 1
    codec => "json"
    auto_offset_reset => "earliest"
  }
}
filter {
  if ![entity] or ![count] { drop { } }
  mutate { convert => { "count" => "integer" } }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "entity-counts"
    document_id => "%{entity}"
    action => "index"
  }
}
