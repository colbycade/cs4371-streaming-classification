input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["topic2"]
    group_id => "logstash-entity-counts"
    auto_offset_reset => "earliest"
    codec => "json"
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "entity-counts"    # mantains most recent count for each entity
    document_id => "%{entity}"
  }
}